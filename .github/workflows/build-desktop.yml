name: Build Windows Setup.exe Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-setup:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static Next.js desktop frontend
        working-directory: frontend
        env:
          DESKTOP_EXPORT: "1"
        run: |
          npm install
          npm run build

      - name: Build standalone Windows backend executable (PyInstaller)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          pyinstaller --noconfirm --onedir --console --name jahtaria-backend `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import email_validator `
            --hidden-import sqlalchemy.sql.default_comparator `
            --hidden-import cryptography `
            --hidden-import edge_tts `
            --hidden-import openpyxl `
            --hidden-import pypdfium2 `
            --hidden-import reportlab.graphics.barcode.code128 `
            desktop_entry.py

      - name: Stage Electron bundled resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/resources/backend | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/webui | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/seed-data/seed_package | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/seed-data/official_pdfs | Out-Null
          Copy-Item -Recurse -Force backend/dist/jahtaria-backend/* desktop/resources/backend/
          Copy-Item -Recurse -Force frontend/out/* desktop/resources/webui/
          Copy-Item -Recurse -Force data/seed_package/* desktop/resources/seed-data/seed_package/
          Copy-Item -Recurse -Force data/official_pdfs/* desktop/resources/seed-data/official_pdfs/
          Copy-Item -Force data/jahtaria-logo.png desktop/resources/seed-data/jahtaria-logo.png

      - name: Build Windows Setup.exe (Electron Builder NSIS)
        working-directory: desktop
        run: |
          npm install
          npm run dist:win

      - name: Upload Setup.exe Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jahtaria-Visa-Intelligence-Windows-Setup
          path: desktop/dist/*.exe

      - name: Publish GitHub Release with Direct Setup.exe Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: "Jahtaria Visa Intelligence Desktop Suite v2.1.0 (Smart Paste, Document & Signature Studio, Editable Spreadsheet & Unlimited Questionnaires)"
          body: |
            ## Jahtaria Visa Intelligence — v2.1.0 (Setup.exe)

            **Zero Python, zero Node.js, zero Docker required.** Download and double-click **`Jahtaria-Visa-Intelligence-Setup-2.1.0.exe`**.

            ### What's New in v2.1.0
            - **Smart Paste Auto-Setup in Chat:** Paste `Ctrl+V` screenshots/images, drop multiple files, or paste API keys, MCP URLs/JSON, ClawLink creds, or CSV/Excel data right in chat — auto-configures with secret masking, Preview/Confirm & Undo.
            - **Per-Client Document & Image Vault + Vision OCR:** Categorized per-client storage (`Passport/ID`, `Financial`, `RGD Civil`, `Embassy Forms`, `Photos`), AI Vision field extraction, **1-Click 92% RGD Photocopy Converter**, **AI Auto-Fill Official PDFs**, and **1-Click Embassy Packet Exporter (PDF/ZIP)**.
            - **Full-Screen Document & Signature Studio:** Open any PDF, image, or DOCX full-screen to place draggable text boxes, checkmarks, dates, and drawn/typed signatures — saves versioned copies while preserving originals.
            - **Editable Client Spreadsheet + Dynamic In-Chat Data Tables:** Inline cell editing, per-row document/image previews, 1-click Sort Tabs, real `.xlsx` Excel / CSV import & export, dynamic sortable/chartable chat tables, and 11 live `/mcp` tools.
            - **Interactive In-Chat Questionnaires:** Clean stepper with Tips & Explanations, Multiple Choice, **Import into Chat**, and unlimited question generation.
            - **Streamlined Connections Hub:** Priority setup order — **ChatGPT OAuth (Recommended) → Composio → ClawLink → Claude/Antigravity OAuth → API Keys**.
          files: desktop/dist/*.exe
          draft: false
          prerelease: false
