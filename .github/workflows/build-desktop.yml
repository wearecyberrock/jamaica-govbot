name: Build Windows Setup.exe Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-setup:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static Next.js desktop frontend
        working-directory: frontend
        env:
          DESKTOP_EXPORT: "1"
        run: |
          npm install
          npm run build

      - name: Build standalone Windows backend executable (PyInstaller)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          pyinstaller --noconfirm --onedir --console --name jahtaria-backend `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import email_validator `
            --hidden-import sqlalchemy.sql.default_comparator `
            --hidden-import cryptography `
            --hidden-import edge_tts `
            --hidden-import openpyxl `
            --hidden-import pypdfium2 `
            --hidden-import reportlab.graphics.barcode.code128 `
            desktop_entry.py

      - name: Stage Electron bundled resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/resources/backend | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/webui | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/seed-data/seed_package | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/seed-data/official_pdfs | Out-Null
          Copy-Item -Recurse -Force backend/dist/jahtaria-backend/* desktop/resources/backend/
          Copy-Item -Recurse -Force frontend/out/* desktop/resources/webui/
          Copy-Item -Recurse -Force data/seed_package/* desktop/resources/seed-data/seed_package/
          Copy-Item -Recurse -Force data/official_pdfs/* desktop/resources/seed-data/official_pdfs/
          Copy-Item -Force data/jahtaria-logo.png desktop/resources/seed-data/jahtaria-logo.png

      - name: Build Windows Setup.exe (Electron Builder NSIS)
        working-directory: desktop
        run: |
          npm install
          npm run dist:win

      - name: Upload Setup.exe Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jahtaria-Visa-Intelligence-Alpha-Windows-Setup
          path: |
            desktop/dist/*.exe
            JAHTARIA_ALPHA_USER_GUIDE.md

      - name: Publish GitHub Release with Direct Setup.exe Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0-alpha
          name: "Jahtaria Visa Intelligence Alpha v2.3.0 (Windows Setup.exe + User Guide)"
          body: |
            ## Jahtaria Visa Intelligence Alpha — v2.3.0 (Windows Setup.exe)

            **Zero Python, zero Node.js, zero Docker required.** Download and double-click **`Jahtaria-Visa-Intelligence-Alpha-Setup-2.3.0.exe`**, and read **`JAHTARIA_ALPHA_USER_GUIDE.md`** for a complete walkthrough.

            ### Highlights in v2.3.0 Alpha
            - **Username Sign-In, Forgot Password & Commercial Handoff:** Offline Recovery PIN + optional Gmail 6-digit OTP + CEO Reset. Initial setup login (`testaccount` / `testpassword`, Recovery PIN `1234`) converts cleanly into your production CEO account as soon as you rename it.
            - **Live Auto-Discovery Flagship Model Picker:** `★ Auto · Best Flagship` on top + live discovery for Antigravity (`gemini-4-neon`, `gemini-4-hydrogen`, `claude-opus-5-5`), Google Gemini API, ChatGPT/OpenAI (`gpt-5.4`), Claude, Grok, OpenRouter, Ollama + Custom Model ID input & automatic 503 failover.
            - **Gmail Automation, Chat Cron Builder & Inbox-to-Vault Sync:** Dual Mode (auto-send routine reminders + approval queue for AI/sensitive messages), create/list/pause/delete cron reminders directly in chat, IMAP inbox polling that auto-saves client email attachments to their Vault, 1-click Copy for WhatsApp, and Hermes Cron export.
            - **Universal File & ZIP Client Synthesizer + Safe Chat Delete:** Drop `.zip`, `.txt`, `.md`, `.json`, `.csv`, `.xlsx`, `.docx`, or `.pdf` files in chat to synthesize new clients & attach matched vault documents with Confirm/Undo.
            - **Full-Screen Document & Signature Studio + 92% RGD Converter + Editable Client Spreadsheet:** Complete Kingston Embassy workflow backed by the bundled `JAHTARIA_Visa_Intelligence_Engineer_Package_v01` dataset.
          files: |
            desktop/dist/*.exe
            JAHTARIA_ALPHA_USER_GUIDE.md
          draft: false
          prerelease: true
