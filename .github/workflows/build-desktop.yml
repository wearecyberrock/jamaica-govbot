name: Build Windows Setup.exe Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-setup:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static Next.js desktop frontend
        working-directory: frontend
        env:
          DESKTOP_EXPORT: "1"
        run: |
          npm install
          npm run build

      - name: Build standalone Windows backend executable (PyInstaller)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          pyinstaller --noconfirm --onedir --console --name jahtaria-backend `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import email_validator `
            --hidden-import sqlalchemy.sql.default_comparator `
            --hidden-import cryptography `
            --hidden-import edge_tts `
            --hidden-import openpyxl `
            --hidden-import pypdfium2 `
            --hidden-import reportlab.graphics.barcode.code128 `
            --hidden-import certifi `
            --hidden-import truststore `
            --collect-data certifi `
            desktop_entry.py

      - name: Stage Electron bundled resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/resources/backend | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/webui | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/seed-data/seed_package | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/seed-data/official_pdfs | Out-Null
          Copy-Item -Recurse -Force backend/dist/jahtaria-backend/* desktop/resources/backend/
          Copy-Item -Recurse -Force frontend/out/* desktop/resources/webui/
          Copy-Item -Recurse -Force data/seed_package/* desktop/resources/seed-data/seed_package/
          Copy-Item -Recurse -Force data/official_pdfs/* desktop/resources/seed-data/official_pdfs/
          Copy-Item -Force data/jahtaria-logo.png desktop/resources/seed-data/jahtaria-logo.png

      - name: Build Windows Setup.exe (Electron Builder NSIS)
        working-directory: desktop
        run: |
          npm install
          npm run dist:win

      - name: Upload Setup.exe Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jahtaria-Visa-Intelligence-Alpha-Windows-Setup
          path: |
            desktop/dist/*.exe
            JAHTARIA_ALPHA_USER_GUIDE.md

      - name: Publish GitHub Release with Direct Setup.exe Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0-alpha
          name: "Jahtaria Visa Intelligence Alpha v2.5.0 (Safe Self-Evolving Live Extensions + Sandboxed Hermes Module Builder)"
          body: |
            ## Jahtaria Visa Intelligence Alpha — v2.5.0 (Windows Setup.exe)

            **Zero Python, zero Node.js, zero Docker required.** Run **`Jahtaria-Visa-Intelligence-Alpha-Setup-2.5.0.exe`** right over your existing install — **all your local client records, accounts, custom extensions, and Obsidian vault are preserved automatically.**

            ### What's New in v2.5.0 Alpha
            - **Safe Self-Evolving Software Engine (Locked Core + AI-Mutable Layer):** Hermes can now evolve the software live just from chatting — without ever risking or recompiling the `.exe`:
              - **Live Custom Risk Rules:** Tell Hermes *"Add a risk rule: flag -12 pts if self-employed without documents"* → evaluates live inside Good Standing immediately with 1-click Undo.
              - **Live Sandboxed Sidebar Widgets / Mini-Apps:** Tell Hermes *"Build a Passport Expiry Tracker widget"* or *"Build a Visa Fee & JMD Calculator"* → builds and mounts a live dark-graphite custom module right into your left sidebar, hydrated with live agency client data inside a safe sandboxed iframe.
              - **Live Quiz Builder Cohorts & Printable PDF Notes:** Add custom client-type cohorts directly into Quiz Builder Effective Pathway & custom agency checklist notes onto printed PDFs.
              - **1-Click Rollback & Portable `.jahtaria-pack.json` Export/Import:** Every self-edit snapshots its previous version for instant rollback and exports cleanly so custom packs can be shared or resold across agencies.
            - **Includes v2.4.1, v2.4.0 & v2.3.1 Upgrades:** Minimal zoom/pan Quiz Builder Flow Canvas (`X → Y → Z → A → Output`) with dropdown/right-click nodes & text-first side chat, 94/6 Documents-First risk engine, Staff/CEO-only login, Windows SSL certificate store fix, and built-in auto-update prompt.
          files: |
            desktop/dist/*.exe
            JAHTARIA_ALPHA_USER_GUIDE.md
          draft: false
          prerelease: true
