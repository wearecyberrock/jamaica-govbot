name: Build Windows Setup.exe Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-setup:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static Next.js desktop frontend
        working-directory: frontend
        env:
          DESKTOP_EXPORT: "1"
        run: |
          npm install
          npm run build

      - name: Build standalone Windows backend executable (PyInstaller)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          pyinstaller --noconfirm --onedir --console --name jahtaria-backend `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import email_validator `
            --hidden-import sqlalchemy.sql.default_comparator `
            --hidden-import cryptography `
            --hidden-import reportlab.graphics.barcode.code128 `
            desktop_entry.py

      - name: Stage Electron bundled resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/resources/backend | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/webui | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/seed-data/seed_package | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/seed-data/official_pdfs | Out-Null
          Copy-Item -Recurse -Force backend/dist/jahtaria-backend/* desktop/resources/backend/
          Copy-Item -Recurse -Force frontend/out/* desktop/resources/webui/
          Copy-Item -Recurse -Force data/seed_package/* desktop/resources/seed-data/seed_package/
          Copy-Item -Recurse -Force data/official_pdfs/* desktop/resources/seed-data/official_pdfs/
          Copy-Item -Force data/jahtaria-logo.png desktop/resources/seed-data/jahtaria-logo.png

      - name: Build Windows Setup.exe (Electron Builder NSIS)
        working-directory: desktop
        run: |
          npm install
          npm run dist:win

      - name: Upload Setup.exe Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jahtaria-Visa-Intelligence-Windows-Setup
          path: desktop/dist/*.exe

      - name: Publish GitHub Release with Direct Setup.exe Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "Jahtaria Visa Intelligence Desktop Suite v1.1.0 (Dark Graphite Agent UI — Setup.exe)"
          body: |
            ## Jahtaria Visa Intelligence — v1.1.0 (Dark Graphite Chatbot-First Edition)

            **Zero Python, zero Node.js, zero Docker required.** Download and double-click **`Jahtaria-Visa-Intelligence-Setup-1.1.0.exe`**.

            ### What's New in v1.1.0
            - **Dark Graphite Chatbot-First Agent Workspace:** Clean centered prompt bar (`Chat` & `Task` modes), collapsible left sidebar, and collapsible Right Side Panel that automatically opens SVG graphs, visual roadmaps, official PICA/DOS PDFs, client Good Standing dossiers, Database tables, and Obsidian notes as you type.
            - **Strict Single-CEO Onboarding:** No hardcoded owner accounts — the agency owner claims the single CEO account on first launch, creates Staff accounts, and Clients can self-register or sign in with a Case Access Code anytime.
          files: desktop/dist/*.exe
          draft: false
          prerelease: false
