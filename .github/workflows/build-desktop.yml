name: Build Windows Setup.exe Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-setup:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static Next.js desktop frontend
        working-directory: frontend
        env:
          DESKTOP_EXPORT: "1"
        run: |
          npm install
          npm run build

      - name: Build standalone Windows backend executable (PyInstaller)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          pyinstaller --noconfirm --onedir --console --name jahtaria-backend `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import email_validator `
            --hidden-import sqlalchemy.sql.default_comparator `
            --hidden-import cryptography `
            --hidden-import edge_tts `
            --hidden-import openpyxl `
            --hidden-import pypdfium2 `
            --hidden-import reportlab.graphics.barcode.code128 `
            --hidden-import certifi `
            --hidden-import truststore `
            --collect-data certifi `
            desktop_entry.py

      - name: Stage Electron bundled resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/resources/backend | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/webui | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/seed-data/seed_package | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/seed-data/official_pdfs | Out-Null
          Copy-Item -Recurse -Force backend/dist/jahtaria-backend/* desktop/resources/backend/
          Copy-Item -Recurse -Force frontend/out/* desktop/resources/webui/
          Copy-Item -Recurse -Force data/seed_package/* desktop/resources/seed-data/seed_package/
          Copy-Item -Recurse -Force data/official_pdfs/* desktop/resources/seed-data/official_pdfs/
          Copy-Item -Force data/jahtaria-logo.png desktop/resources/seed-data/jahtaria-logo.png

      - name: Build Windows Setup.exe (Electron Builder NSIS)
        working-directory: desktop
        run: |
          npm install
          npm run dist:win

      - name: Upload Setup.exe Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jahtaria-Visa-Intelligence-Alpha-Windows-Setup
          path: |
            desktop/dist/*.exe
            JAHTARIA_ALPHA_USER_GUIDE.md

      - name: Publish GitHub Release with Direct Setup.exe Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0-alpha
          name: "Jahtaria Visa Intelligence Alpha v2.4.0 (Quiz Builder X/Y/Z/A Diagram + Weighted Risk Engine + Hidden Pattern Analysis)"
          body: |
            ## Jahtaria Visa Intelligence Alpha — v2.4.0 (Windows Setup.exe)

            **Zero Python, zero Node.js, zero Docker required.** Run **`Jahtaria-Visa-Intelligence-Alpha-Setup-2.4.0.exe`** right over your existing install — **all your local client records, accounts, and Obsidian vault are preserved automatically.**

            ### What's New in v2.4.0 Alpha
            - **Interactive Quiz Builder (`X / Y / Z / A` Relationship Diagram Canvas):** New sidebar tab with live SVG Bezier mapping connecting **X** (Generated Questions from Client Data & DB) → **Y** (Client Practice Answers) ↔ **Z** (Official U.S. Embassy Questions) → **A** (Official Winning Answers & Proof Patterns). Includes **Generate Questions**, criteria filters (*Most Common*, *Hardest*, *Weak/Risky*, *Most Used*, answer strength, visa class), **Effective Pathway** client/cohort tracing showing which client types get through the most (`n` sample counts), **Analyze Hidden Patterns** deep pattern & Embassy follow-up chain miner, and **Print Questions** formatted PDF sheets (for a specific client OR general agency training bank).
            - **Weighted Good Standing & Risk Scoring Correction:** Documents & Personal Data now drive ~90% of risk; answering follow-up or practice questions no longer wipes out real document/personal-data risk penalties and instead contributes a small, honest capped readiness lift (`+1` per item, up to `+6` pts max).
            - **Streamlined Agency Staff & CEO Login:** Removed Client Sign Up and Case Code tabs from `/login` while keeping all existing internal client case management, questionnaires, mock practice, and popups intact.
            - **Includes v2.3.1 Fixes:** Windows SSL/TLS native Certificate Store (`truststore` + `certifi`) for OpenAI Codex OAuth & Voice, plus built-in GitHub Releases update checker.
          files: |
            desktop/dist/*.exe
            JAHTARIA_ALPHA_USER_GUIDE.md
          draft: false
          prerelease: true
