name: Build Windows Setup.exe Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-setup:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static Next.js desktop frontend
        working-directory: frontend
        env:
          DESKTOP_EXPORT: "1"
        run: |
          npm install
          npm run build

      - name: Build standalone Windows backend executable (PyInstaller)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          pyinstaller --noconfirm --onedir --console --name jahtaria-backend `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import email_validator `
            --hidden-import sqlalchemy.sql.default_comparator `
            --hidden-import cryptography `
            --hidden-import edge_tts `
            --hidden-import openpyxl `
            --hidden-import pypdfium2 `
            --hidden-import reportlab.graphics.barcode.code128 `
            --hidden-import certifi `
            --hidden-import truststore `
            --collect-data certifi `
            desktop_entry.py

      - name: Stage Electron bundled resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/resources/backend | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/webui | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/seed-data/seed_package | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/seed-data/official_pdfs | Out-Null
          Copy-Item -Recurse -Force backend/dist/jahtaria-backend/* desktop/resources/backend/
          Copy-Item -Recurse -Force frontend/out/* desktop/resources/webui/
          Copy-Item -Recurse -Force data/seed_package/* desktop/resources/seed-data/seed_package/
          Copy-Item -Recurse -Force data/official_pdfs/* desktop/resources/seed-data/official_pdfs/
          Copy-Item -Force data/jahtaria-logo.png desktop/resources/seed-data/jahtaria-logo.png

      - name: Build Windows Setup.exe (Electron Builder NSIS)
        working-directory: desktop
        run: |
          npm install
          npm run dist:win

      - name: Upload Setup.exe Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jahtaria-Visa-Intelligence-Alpha-Windows-Setup
          path: |
            desktop/dist/*.exe
            JAHTARIA_ALPHA_USER_GUIDE.md

      - name: Publish GitHub Release with Direct Setup.exe Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.1-alpha
          name: "Jahtaria Visa Intelligence Alpha v2.5.1 (Model Picker Fix, Instant Sync & Antigravity Disconnect)"
          body: |
            ## Jahtaria Visa Intelligence Alpha — v2.5.1 (Windows Setup.exe)

            **Zero Python, zero Node.js, zero Docker required.** Run **`Jahtaria-Visa-Intelligence-Alpha-Setup-2.5.1.exe`** right over your existing install — **all your local client records, accounts, custom extensions, and Obsidian vault are preserved automatically.**

            ### What's Fixed in v2.5.1 Alpha
            - **Fixed Model Picker Getting Stuck on Antigravity:**
              - **Instant Model Catalog Sync:** Connecting ChatGPT/Codex, Claude Pro/Max, saving an API key (Gemini, OpenAI, Anthropic, Grok, OpenRouter, Qwen, MiniMax), configuring Ollama, pasting an API key in chat, refreshing live models, or setting a Custom Model ID now updates the chat model dropdown immediately — no more snapping back to Antigravity while Settings is open.
              - **Clean `★ Auto · Best Flagship` Routing:** Ambient `~/.gemini/` token files on disk no longer hijack `Auto` mode ahead of your configured cloud API keys or Local Ollama.
              - **Real 1-Click Disconnect Controls:** Added **Disconnect** buttons for Antigravity, ChatGPT/Codex, and Claude Pro/Max inside Settings (plus an Active AI status bar with **Use Auto** and **Test AI**). Disconnecting Antigravity persists cleanly even when `agy.exe` or `~/.gemini/` exists locally and automatically switches active AI back to `Auto`.
              - **Zero Cross-Provider Model Leakage:** Switching providers via Settings or Smart Paste cleanly resets stale model IDs and eliminates duplicate `★ Auto` dropdown options.
            - **Includes all v2.5.0 – v2.3.1 Alpha Features:** Safe Self-Evolving Live Extensions Engine, Quiz Builder propagation canvas (`X → Y → Z → A → Output`), 94/6 Documents-First risk engine, Windows SSL certificate store fix, and built-in GitHub Release auto-update popup.
          files: |
            desktop/dist/*.exe
            JAHTARIA_ALPHA_USER_GUIDE.md
          draft: false
          prerelease: true
