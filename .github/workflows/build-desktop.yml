name: Build Windows Setup.exe Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-setup:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static Next.js desktop frontend
        working-directory: frontend
        env:
          DESKTOP_EXPORT: "1"
        run: |
          npm install
          npm run build

      - name: Build standalone Windows backend executable (PyInstaller)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          pyinstaller --noconfirm --onedir --console --name jahtaria-backend `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import email_validator `
            --hidden-import sqlalchemy.sql.default_comparator `
            --hidden-import cryptography `
            --hidden-import edge_tts `
            --hidden-import openpyxl `
            --hidden-import pypdfium2 `
            --hidden-import reportlab.graphics.barcode.code128 `
            --hidden-import certifi `
            --hidden-import truststore `
            --collect-data certifi `
            desktop_entry.py

      - name: Stage Electron bundled resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/resources/backend | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/webui | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/seed-data/seed_package | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/seed-data/official_pdfs | Out-Null
          Copy-Item -Recurse -Force backend/dist/jahtaria-backend/* desktop/resources/backend/
          Copy-Item -Recurse -Force frontend/out/* desktop/resources/webui/
          Copy-Item -Recurse -Force data/seed_package/* desktop/resources/seed-data/seed_package/
          Copy-Item -Recurse -Force data/official_pdfs/* desktop/resources/seed-data/official_pdfs/
          Copy-Item -Force data/jahtaria-logo.png desktop/resources/seed-data/jahtaria-logo.png

      - name: Build Windows Setup.exe (Electron Builder NSIS)
        working-directory: desktop
        run: |
          npm install
          npm run dist:win

      - name: Upload Setup.exe Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jahtaria-Visa-Intelligence-Alpha-Windows-Setup
          path: |
            desktop/dist/*.exe
            JAHTARIA_ALPHA_USER_GUIDE.md

      - name: Publish GitHub Release with Direct Setup.exe Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.2-alpha
          name: "Jahtaria Visa Intelligence Alpha v2.5.2 (Live ChatGPT Codex Models, Auto-Failover & Latest Flagships)"
          body: |
            ## Jahtaria Visa Intelligence Alpha — v2.5.2 (Windows Setup.exe)

            **Zero Python, zero Node.js, zero Docker required.** Run **`Jahtaria-Visa-Intelligence-Alpha-Setup-2.5.2.exe`** right over your existing install — **all your local client records, accounts, custom extensions, and Obsidian vault are preserved automatically.**

            ### What's Fixed in v2.5.2 Alpha
            - **Fixed ChatGPT Codex HTTP 400 Unsupported Model Error (`gpt-5.4` / `gpt-5.3-codex`):**
              - **Live Per-Account Codex Model Discovery:** Queries `chatgpt.com/backend-api/codex/models` with your `ChatGPT-Account-ID` & residency headers (matching Hermes) so your model picker shows the exact latest models entitled on your ChatGPT account (`gpt-6-sol`, `gpt-6-luna`, `gpt-5.6-sol`, `gpt-5.6-terra`, `gpt-5.5`, etc.) instead of hardcoded retired slugs.
              - **Automatic Unsupported-Model Migration & Failover:** If an existing install had an older/retired Codex model (`gpt-5.4`, `gpt-5.3-codex`, etc.) saved, the app automatically migrates to your account's top supported Codex model and automatically fails over on HTTP 400/404 model rejections.
              - **Updated All Provider Flagship Catalogs:** Refreshed live discovery & curated fallbacks for ChatGPT Codex, OpenAI API, Anthropic Claude (`claude-fable-5-2`, `claude-opus-5-5`, `claude-sonnet-4-6`), xAI Grok (`grok-4.6`), OpenRouter, Qwen (`qwen3.8-max`), and MiniMax (`MiniMax-M3`).
            - **Includes all v2.5.1 – v2.3.1 Alpha Fixes & Features:** Instant model picker sync, 1-click Disconnect for Antigravity/Codex/Claude, clean `★ Auto` routing, Safe Self-Evolving Live Extensions Engine, Quiz Builder propagation canvas, 94/6 Documents-First risk engine, Windows SSL certificate store fix, and built-in auto-update popup.
          files: |
            desktop/dist/*.exe
            JAHTARIA_ALPHA_USER_GUIDE.md
          draft: false
          prerelease: true
