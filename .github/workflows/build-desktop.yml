name: Build Windows Setup.exe Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-setup:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static Next.js desktop frontend
        working-directory: frontend
        env:
          DESKTOP_EXPORT: "1"
        run: |
          npm install
          npm run build

      - name: Build standalone Windows backend executable (PyInstaller)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          pyinstaller --noconfirm --onedir --console --name jahtaria-backend `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import email_validator `
            --hidden-import sqlalchemy.sql.default_comparator `
            --hidden-import cryptography `
            --hidden-import edge_tts `
            --hidden-import openpyxl `
            --hidden-import pypdfium2 `
            --hidden-import reportlab.graphics.barcode.code128 `
            --hidden-import certifi `
            --hidden-import truststore `
            --collect-data certifi `
            desktop_entry.py

      - name: Stage Electron bundled resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/resources/backend | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/webui | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/seed-data/seed_package | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/resources/seed-data/official_pdfs | Out-Null
          Copy-Item -Recurse -Force backend/dist/jahtaria-backend/* desktop/resources/backend/
          Copy-Item -Recurse -Force frontend/out/* desktop/resources/webui/
          Copy-Item -Recurse -Force data/seed_package/* desktop/resources/seed-data/seed_package/
          Copy-Item -Recurse -Force data/official_pdfs/* desktop/resources/seed-data/official_pdfs/
          Copy-Item -Force data/jahtaria-logo.png desktop/resources/seed-data/jahtaria-logo.png

      - name: Build Windows Setup.exe (Electron Builder NSIS)
        working-directory: desktop
        run: |
          npm install
          npm run dist:win

      - name: Upload Setup.exe Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jahtaria-Visa-Intelligence-Alpha-Windows-Setup
          path: |
            desktop/dist/*.exe
            JAHTARIA_ALPHA_USER_GUIDE.md

      - name: Publish GitHub Release with Direct Setup.exe Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.1-alpha
          name: "Jahtaria Visa Intelligence Alpha v2.4.1 (Minimal Zoomable Quiz Flow Canvas + Text-First Side Chat)"
          body: |
            ## Jahtaria Visa Intelligence Alpha — v2.4.1 (Windows Setup.exe)

            **Zero Python, zero Node.js, zero Docker required.** Run **`Jahtaria-Visa-Intelligence-Alpha-Setup-2.4.1.exe`** right over your existing install — **all your local client records, accounts, and Obsidian vault are preserved automatically.**

            ### What's New in v2.4.1 Alpha
            - **Minimal Zoomable & Pannable Quiz Builder Flow Canvas (`X → Y → Z → A → Output`):** Redesigned in the calm Graphite style of the main dashboard. Scroll to zoom, drag to pan, and watch animated propagation wires flow from Client Questions (`X`) → Client Answers (`Y`) → Official Embassy Questions (`Z`) → Official Outcomes (`A`) straight into the **Generated Questions Output** lane.
            - **Uncluttered Nodes with Dropdown (`▾`) & Right-Click Menu:** Every node stays sleek and compact by default — click its dropdown arrow or right-click to expand details, trace its propagation flow, play U.S. Officer voice, record answers, or send to chat.
            - **Clean Text-First Side Chat (Zero Toolbar Clutter):** No crowded rows of buttons or extra tabs — just type naturally in the side chat (*"Generate 4 questions for C034"*, *"Trace effective pathway"*, *"Filter hardest"*, *"Find all hidden patterns"*, *"Print questions PDF"*, or *"Add official question..."*).
            - **Includes v2.4.0 & v2.3.1 Upgrades:** 94/6 Documents-First weighted risk scoring, Staff/CEO-only login, Windows SSL certificate store fix (`truststore` + `certifi`), and built-in GitHub Releases auto-update prompt.
          files: |
            desktop/dist/*.exe
            JAHTARIA_ALPHA_USER_GUIDE.md
          draft: false
          prerelease: true
